<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <header class="text-center mb-12">
            <h1 class="text-5xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent mb-4">Finance Dashboard</h1>
            <p class="text-xl text-gray-600">Track your income, expenses, and financial trends</p>
        </header>

        <!-- Summary Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12" id="summary-cards">
            <div class="bg-white rounded-2xl shadow-xl p-8 transform hover:scale-105 transition-all duration-300">
                <div class="flex items-center">
                    <div class="p-3 bg-green-100 rounded-xl">
                        <i class="fas fa-arrow-up text-2xl text-green-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 font-medium">Total Income</p>
                        <p class="text-3xl font-bold text-green-600" id="total-income">$0.00</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-xl p-8 transform hover:scale-105 transition-all duration-300">
                <div class="flex items-center">
                    <div class="p-3 bg-red-100 rounded-xl">
                        <i class="fas fa-arrow-down text-2xl text-red-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 font-medium">Total Expense</p>
                        <p class="text-3xl font-bold text-red-600" id="total-expense">$0.00</p>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-2xl shadow-xl p-8 transform hover:scale-105 transition-all duration-300">
                <div class="flex items-center">
                    <div class="p-3 bg-blue-100 rounded-xl">
                        <i class="fas fa-balance-scale text-2xl text-blue-600"></i>
                    </div>
                    <div class="ml-4">
                        <p class="text-gray-600 font-medium">Net Balance</p>
                        <p class="text-3xl font-bold text-blue-600" id="net-balance">$0.00</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 mb-12">
            <!-- Category Breakdown Chart -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <h3 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
                    <i class="fas fa-chart-pie mr-3 text-purple-500"></i>Category Breakdown
                </h3>
                <canvas id="categoryChart" height="300"></canvas>
            </div>

            <!-- Recent Activity -->
            <div class="bg-white rounded-2xl shadow-xl p-6">
                <h3 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
                    <i class="fas fa-history mr-3 text-orange-500"></i>Recent Activity
                </h3>
                <div id="recent-list" class="space-y-3">
                    <div class="text-center py-8 text-gray-400">Loading...</div>
                </div>
            </div>
        </div>

        <!-- Monthly Trends -->
        <div class="bg-white rounded-2xl shadow-xl p-6">
            <h3 class="text-2xl font-bold mb-6 text-gray-800 flex items-center">
                <i class="fas fa-chart-line mr-3 text-green-500"></i>Monthly Trends
            </h3>
            <canvas id="trendChart" height="200"></canvas>
        </div>

        <!-- Quick Actions (placeholder) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
            <button class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl transform hover:scale-105 transition-all duration-300 flex items-center justify-center mx-auto">
                <i class="fas fa-plus mr-2"></i>Add Record
            </button>
            <a href="/admin/" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl transform hover:scale-105 transition-all duration-300 flex items-center justify-center mx-auto">
                <i class="fas fa-cog mr-2"></i>Admin
            </a>
            <a href="/api/records/" class="bg-green-600 hover:bg-green-700 text-white font-bold py-4 px-8 rounded-2xl shadow-xl transform hover:scale-105 transition-all duration-300 flex items-center justify-center mx-auto">
                <i class="fas fa-list mr-2"></i>Records API
            </a>
        </div>
    </div>

    <script>
        const API_BASE = '/api/dashboard/';

        async function loadDashboard() {
            try {
                const response = await fetch(API_BASE);
                const data = await response.json();
                
                // Update summary cards
                document.getElementById('total-income').textContent = `$${data.total_income.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                document.getElementById('total-expense').textContent = `$${data.total_expense.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                document.getElementById('net-balance').textContent = `$${data.net_balance.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                // Category chart
                const ctx1 = document.getElementById('categoryChart').getContext('2d');
                new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: data.category_totals.map(c => c.category || 'Uncategorized'),
                        datasets: [{
                            data: data.category_totals.map(c => c.total),
                            backgroundColor: ['#10b981', '#ef4444', '#f59e0b', '#8b5cf6', '#3b82f6', '#ec4899']
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
                });

                // Recent activity
                const recentList = document.getElementById('recent-list');
                recentList.innerHTML = data.recent_activity.map(r => `
                    <div class="flex justify-between items-center p-4 bg-gray-50 rounded-xl">
                        <div>
                            <div class="font-semibold">${r.category}</div>
                            <div class="text-sm text-gray-500">${r.date}</div>
                        </div>
                        <div class="text-right">
                            <div class="font-bold text-lg ${r.type === 'income' ? 'text-green-600' : 'text-red-600'}">$${r.amount.toLocaleString()}</div>
                            <div class="text-xs uppercase tracking-wide ${r.type === 'income' ? 'text-green-500' : 'text-red-500'}">${r.type}</div>
                        </div>
                    </div>
                `).join('') || '<div class="text-center py-8 text-gray-400"><i class="fas fa-inbox text-4xl mb-2 block"></i>No recent activity</div>';

                // Monthly trends
                const ctx2 = document.getElementById('trendChart').getContext('2d');
                const months = data.monthly_trends.map(t => new Date(t.month).toLocaleDateString('en-US', { year: 'numeric', month: 'short' }));
                new Chart(ctx2, {
                    type: 'line',
                    data: {
                        labels: months,
                        datasets: [{
                            label: 'Income',
                            data: data.monthly_trends.map(t => t.income || 0),
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            tension: 0.4
                        }, {
                            label: 'Expense',
                            data: data.monthly_trends.map(t => t.expense || 0),
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239, 68, 68, 0.1)',
                            tension: 0.4
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { position: 'top' } } }
                });

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.querySelectorAll('#summary-cards p[id]').forEach(el => el.textContent = 'Error loading');
            }
        }

        // Refresh every 30s
        loadDashboard();
        setInterval(loadDashboard, 30000);

        // Sample data button (disabled, use admin)
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', e => {
                if (e.target.textContent.includes('Add Record')) {
                    alert('Use /admin/ or API to add records!');
                }
            });
        });
    </script>
</body>
</html>
